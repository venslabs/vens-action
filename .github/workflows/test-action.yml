name: Test action

on:
  pull_request:
    paths:
      - action.yml
      - testdata/**
      - .github/workflows/test-action.yml
  push:
    branches: [main]
    paths:
      - action.yml
      - testdata/**
      - .github/workflows/test-action.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows-latest · install and run
    runs-on: windows-latest
    env:
      VENS_VERSION: v0.6.0
      SBOM_SERIAL: urn:uuid:3e671687-395b-41f5-a30f-a58921a69b79
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # The integration job's scanner install is Linux and macOS only, so this job checks install and run on a fixed report.
      - name: Write a scan report
        id: report
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/scan.json"
          jq -n '{SchemaVersion: 2, ArtifactName: "windows", ArtifactType: "container_image",
            Results: [{Target: "windows", Class: "os-pkgs", Type: "debian",
              Vulnerabilities: [
                {VulnerabilityID: "CVE-2025-0001", PkgName: "libexample", InstalledVersion: "1.0-1",
                 PkgIdentifier: {PURL: "pkg:deb/debian/libexample@1.0-1"}, Severity: "HIGH"},
                {VulnerabilityID: "CVE-2025-0002", PkgName: "libexample", InstalledVersion: "1.0-1",
                 PkgIdentifier: {PURL: "pkg:deb/debian/libexample@1.0-1"}, Severity: "LOW"}]}]}' > "${out}"
          echo "report=${out}" >> "${GITHUB_OUTPUT}"

      - name: Run vens action
        id: vens
        uses: ./
        with:
          version: ${{ env.VENS_VERSION }}
          config-file: testdata/config.yaml
          input-report: ${{ steps.report.outputs.report }}
          input-format: trivy
          output-vex: ${{ runner.temp }}/vex.cdx.json
          sbom-serial-number: ${{ env.SBOM_SERIAL }}
          llm-provider: mock
          attest: "true"
          enrich: "true"
          output-enriched-report: ${{ runner.temp }}/enriched.json

      - name: Copy vens.exe out of the install dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/custom-bin"
          cp "${RUNNER_TEMP}/vens-${VENS_VERSION}/vens.exe" "${RUNNER_TEMP}/custom-bin/vens.exe"

      - name: Run vens action from a backslash bin-path
        id: binpath
        uses: ./
        with:
          bin-path: ${{ runner.temp }}\custom-bin\vens.exe
          config-file: testdata/config.yaml
          input-report: ${{ steps.report.outputs.report }}
          input-format: trivy
          output-vex: ${{ runner.temp }}/vex-binpath.cdx.json
          sbom-serial-number: ${{ env.SBOM_SERIAL }}
          llm-provider: mock

      - name: Assert outputs
        shell: bash
        env:
          VEX_FILE: ${{ steps.vens.outputs.vex-file }}
          VEX_BINPATH: ${{ steps.binpath.outputs.vex-file }}
          ATTESTATION: ${{ steps.vens.outputs.attestation-file }}
          ENRICHED: ${{ steps.vens.outputs.enriched-report }}
          COUNTS: ${{ steps.vens.outputs.count-critical }} ${{ steps.vens.outputs.count-high }} ${{ steps.vens.outputs.count-medium }} ${{ steps.vens.outputs.count-low }} ${{ steps.vens.outputs.count-info }}
        run: |
          set -euo pipefail
          for vex in "${VEX_FILE}" "${VEX_BINPATH}"; do
            jq -e '.bomFormat == "CycloneDX"' "${vex}"
            jq -e '[.vulnerabilities[] | select(.ratings[]?.method == "OWASP")] | length == 2' "${vex}"
          done
          total=0
          for n in ${COUNTS}; do total=$(( total + n )); done
          test "${total}" -eq 2
          test -s "${ATTESTATION}"
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.Custom.owasp_score != null)] | length == 2' "${ENRICHED}"
          # bin-path's dir was added to GITHUB_PATH last, so vens must resolve there.
          case "$(command -v vens)" in
            */custom-bin/vens*) ;;
            *) echo "vens resolves to $(command -v vens), not the bin-path dir"; exit 1 ;;
          esac

      - name: Gate on Windows
        id: gate
        continue-on-error: true
        uses: ./
        with:
          bin-path: ${{ runner.temp }}\custom-bin\vens.exe
          config-file: testdata/config.yaml
          input-report: ${{ steps.report.outputs.report }}
          input-format: trivy
          output-vex: ${{ runner.temp }}/vex-gate.cdx.json
          sbom-serial-number: ${{ env.SBOM_SERIAL }}
          llm-provider: mock
          fail-on-severity: low

      - name: Assert the gate failed after scoring
        shell: bash
        env:
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          test "${OUTCOME}" = failure
          jq -e '.vulnerabilities | length == 2' "${RUNNER_TEMP}/vex-gate.cdx.json"

  integration:
    name: ${{ matrix.os }} · ${{ matrix.scanner.name }} ${{ matrix.scanner.version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        scanner:
          - { name: trivy, version: v0.69.3 }
          - { name: trivy, version: v0.69.2 }
          - { name: grype, version: v0.111.0 }
          - { name: grype, version: v0.110.0 }
    env:
      SCAN_IMAGE: python:3.9-slim
      VENS_VERSION: v0.3.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install ${{ matrix.scanner.name }} ${{ matrix.scanner.version }}
        id: scanner
        shell: bash
        env:
          SCANNER_NAME: ${{ matrix.scanner.name }}
          SCANNER_VERSION: ${{ matrix.scanner.version }}
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/scanner-bin"
          mkdir -p "${bin_dir}"
          cd "${bin_dir}"
          ver="${SCANNER_VERSION#v}"
          case "${RUNNER_OS}" in
            Linux)  t_os=Linux;  g_os=linux ;;
            macOS)  t_os=macOS;  g_os=darwin ;;
          esac
          case "${RUNNER_ARCH}" in
            X64)    t_arch=64bit; g_arch=amd64 ;;
            ARM64)  t_arch=ARM64; g_arch=arm64 ;;
          esac
          case "${SCANNER_NAME}" in
            trivy)
              tarball="trivy_${ver}_${t_os}-${t_arch}.tar.gz"
              checksums="trivy_${ver}_checksums.txt"
              base="https://github.com/aquasecurity/trivy/releases/download/${SCANNER_VERSION}"
              ;;
            grype)
              tarball="grype_${ver}_${g_os}_${g_arch}.tar.gz"
              checksums="grype_${ver}_checksums.txt"
              base="https://github.com/anchore/grype/releases/download/${SCANNER_VERSION}"
              ;;
          esac
          curl -fsSL --proto '=https' --tlsv1.2 -o "${tarball}" "${base}/${tarball}"
          curl -fsSL --proto '=https' --tlsv1.2 -o checksums.txt "${base}/${checksums}"
          grep -F "${tarball}" checksums.txt | shasum -a 256 -c -
          tar -xzf "${tarball}" "${SCANNER_NAME}"
          chmod +x "${SCANNER_NAME}"
          echo "bin=${bin_dir}/${SCANNER_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Scan ${{ env.SCAN_IMAGE }}
        id: scan
        shell: bash
        env:
          SCANNER_NAME: ${{ matrix.scanner.name }}
          SCANNER_BIN: ${{ steps.scanner.outputs.bin }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/scan.json"
          case "${SCANNER_NAME}" in
            trivy) "${SCANNER_BIN}" image --quiet --format json --output "${out}" "${SCAN_IMAGE}" ;;
            grype) "${SCANNER_BIN}" "${SCAN_IMAGE}" -o json > "${out}" ;;
          esac
          test -s "${out}"
          echo "report=${out}" >> "${GITHUB_OUTPUT}"

      - name: Run vens action
        id: vens
        uses: ./
        with:
          version: ${{ env.VENS_VERSION }}
          config-file: testdata/config.yaml
          input-report: ${{ steps.scan.outputs.report }}
          input-format: ${{ matrix.scanner.name }}
          output-vex: ${{ runner.temp }}/vex.cdx.json
          sbom-serial-number: urn:uuid:3e671687-395b-41f5-a30f-a58921a69b79
          llm-provider: mock
          enrich: ${{ matrix.scanner.name == 'trivy' }}
          output-enriched-report: ${{ runner.temp }}/enriched.json

      - name: Assert VEX shape
        shell: bash
        env:
          VEX_FILE: ${{ steps.vens.outputs.vex-file }}
        run: |
          set -euo pipefail
          jq -e '.bomFormat == "CycloneDX"' "${VEX_FILE}"
          jq -e '.vulnerabilities | length > 0' "${VEX_FILE}"
          jq -e '[.vulnerabilities[] | select(.ratings[]?.method == "OWASP")] | length > 0' "${VEX_FILE}"

      - name: Assert enriched report
        if: matrix.scanner.name == 'trivy'
        shell: bash
        env:
          ENRICHED: ${{ steps.vens.outputs.enriched-report }}
        run: |
          set -euo pipefail
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.Custom.owasp_score != null)] | length > 0' "${ENRICHED}"
